[package]
name = "fw-library"
description = "Ordner live lesen, Tags, Dekodieren, Wellenform und BPM-Analyse für FadeWerk DJ"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
fw-engine.workspace = true
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
symphonia = { version = "0.6", features = ["all"] }
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
dirs = "7"
# FFT für die Tonart-Erkennung (MIT/Apache, kommt ohnehin über symphonia mit)
rustfft = "6"
# Akustischer Fingerabdruck für die Online-Erkennung (MIT, reines Rust)
rusty-chromaprint = "0.3.0"
