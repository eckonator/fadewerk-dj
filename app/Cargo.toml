[package]
name = "fadewerk-dj"
description = "DJ-Player mit zwei Decks, zwei Playlists und Auto-Fade"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
fw-engine.workspace = true
fw-library.workspace = true
rtrb.workspace = true
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
eframe = { version = "0.36", features = ["glow"] }
egui_extras = "0.36"
cpal = "0.18"
rfd = "0.17"
dirs = "7"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
keepawake = "0.6"

# Andere Programme im Lautstärkemixer stumm schalten (app/src/quiet.rs); kommt ohnehin über cpal mit
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

# Icon und Versionsangaben für die Windows-.exe (app/build.rs)
[build-dependencies]
winresource = { version = "0.1", default-features = false }
