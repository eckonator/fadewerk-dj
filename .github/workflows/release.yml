# Baut FadeWerk DJ für macOS, Windows und Linux (x86_64 und arm64) und veröffentlicht einen Release unter der
# Versionsnummer aus Cargo.toml (Tag `v<Version>`).
#
# - Jeder Push auf main ersetzt den Release dieser Version durch den neuen Stand.
# - Neue Version: `version` in Cargo.toml erhöhen; der nächste Push legt den neuen Release an,
#   ältere Versionen bleiben stehen.
# - Von Hand unter „Actions → Release → Run workflow“: nur Artefakte, kein Release.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Bei schnell aufeinanderfolgenden Pushes nur den neuesten Stand bauen
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          # Älteres Ubuntu, damit das Programm auch auf älteren Distributionen läuft (glibc)
          - os: ubuntu-22.04
            name: Linux
            arch: x86_64
          # ARM64, z. B. Raspberry Pi 4/5 mit 64-Bit-Raspberry-Pi-OS (Bookworm hat glibc 2.36)
          - os: ubuntu-22.04-arm
            name: Linux-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Pakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev pkg-config

      - name: Tests
        run: cargo test --workspace --release

      - name: Lizenzhinweise der Bibliotheken sammeln
        shell: bash
        run: |
          cargo install cargo-bundle-licenses --locked
          cargo bundle-licenses --format yaml --output THIRD-PARTY-LICENSES.yml

      - name: Version bestimmen
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # macOS: Universal-Binary (Apple Silicon + Intel), als .app gebündelt. Signiert mit dem eigenen
      # Zertifikat des Projekts (Secrets MACOS_SIGN_P12 als Base64 und MACOS_SIGN_PASSWORD), damit das
      # Update per Knopf die neue Version als echt erkennt; ohne die Secrets ad-hoc.
      - name: macOS bauen
        if: matrix.name == 'macOS'
        # Gleiche Mindestversion wie im Info.plist (LSMinimumSystemVersion), auch für die Intel-Hälfte
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          FW_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -n "$MACOS_SIGN_P12" ]; then
            echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
            eval "$(scripts/signing-keychain.sh "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/sign.keychain-db")"
            rm "$RUNNER_TEMP/sign.p12"
          else
            echo "::warning::kein Signatur-Zertifikat, die App wird ad-hoc signiert"
          fi
          cargo build --release -p fadewerk-dj --target aarch64-apple-darwin
          cargo build --release -p fadewerk-dj --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/fadewerk-dj \
            target/aarch64-apple-darwin/release/fadewerk-dj target/x86_64-apple-darwin/release/fadewerk-dj
          FW_SKIP_BUILD=1 scripts/bundle-macos.sh
          mkdir -p pkg
          cp README.md LICENSE THIRD-PARTY-LICENSES.yml assets/fonts/OFL-*.txt dist/
          ditto -c -k --keepParent "dist/FadeWerk DJ.app" "pkg/FadeWerk-DJ-${{ steps.version.outputs.version }}-macOS.zip"
          (cd dist && zip -q "../pkg/FadeWerk-DJ-${{ steps.version.outputs.version }}-macOS.zip" README.md LICENSE THIRD-PARTY-LICENSES.yml OFL-*.txt)

      # Zusätzlich ein DMG mit Installationsfenster (App nach „Programme“ ziehen).
      # Die ZIP bleibt, weil scripts/install-macos.sh sie herunterlädt.
      - name: macOS-DMG
        if: matrix.name == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
          DMG_PYTHON="$RUNNER_TEMP/dmgbuild/bin/python3" scripts/make-dmg.sh \
            "pkg/FadeWerk-DJ-${{ steps.version.outputs.version }}-macOS.dmg"

      # Icon und Versionsangaben bettet app/build.rs ein (assets/icon.ico)
      - name: Windows bauen
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          cargo build --release -p fadewerk-dj
          DIR="FadeWerk-DJ-${{ steps.version.outputs.version }}-Windows"
          mkdir -p "pkg/$DIR"
          cp target/release/fadewerk-dj.exe "pkg/$DIR/FadeWerk DJ.exe"
          cp README.md LICENSE THIRD-PARTY-LICENSES.yml assets/fonts/OFL-*.txt "pkg/$DIR/"
          cd pkg && 7z a -tzip "$DIR.zip" "$DIR" > /dev/null && rm -r "$DIR"

      - name: Linux bauen
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p fadewerk-dj
          DIR="FadeWerk-DJ-${{ steps.version.outputs.version }}-Linux-${{ matrix.arch }}"
          mkdir -p "pkg/$DIR"
          cp target/release/fadewerk-dj assets/fadewerk-dj.desktop README.md LICENSE \
            THIRD-PARTY-LICENSES.yml assets/fonts/OFL-*.txt "pkg/$DIR/"
          cp assets/icon-256.png "pkg/$DIR/fadewerk-dj.png"
          cp scripts/install-linux.sh "pkg/$DIR/install.sh"
          cd pkg && tar czf "$DIR.tar.gz" "$DIR" && rm -r "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: FadeWerk-DJ-${{ matrix.name }}
          path: pkg/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true
      # Release dieser Version samt Tag entfernen, damit der Tag auf den neuen Commit zeigt.
      # Dazu den früheren „Development build“ (Tag `dev`) aufräumen.
      - name: Alten Release dieser Version entfernen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ steps.version.outputs.version }}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release delete dev --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FadeWerk DJ ${{ steps.version.outputs.version }}
          body: |
            Builds for macOS (Apple Silicon and Intel, one universal app), Windows (64-bit) and Linux (x86_64 and arm64, e.g. Raspberry Pi 4/5 with 64-bit Raspberry Pi OS).

            **macOS, easiest way** (no Gatekeeper prompt): paste into Terminal
            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-macos.sh | bash
            ```
            Or open the `.dmg` and drag FadeWerk DJ to Applications.

            **Already installed?** Use **Update now** in the app (macOS, the Windows `.exe` from the zip, Linux installed with `install.sh`).

            Built from commit ${{ github.sha }}. Installation notes are in the README.
          files: pkg/*
